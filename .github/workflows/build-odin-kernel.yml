name: build-odin-kernel

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 0. 检出本仓库（取移植补丁）
        uses: actions/checkout@v4

      - name: 1. 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 2. 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 zip lz4 zstd git curl rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: 3. 下载 AOSP clang r383902b1
        run: |
          cd $HOME
          curl -sSL -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          ./clang/bin/clang --version | head -2

      - name: 4. 拉取内核源码（保留树内 kernelsu）
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b master https://github.com/MrNya907/xiaomi_kernel_odin.git kernel
          cd kernel && git log -1 --oneline
          ls drivers/kernelsu | head -10

      - name: 5. 打 Mix4 SukiSU 移植补丁
        run: |
          cd $GITHUB_WORKSPACE/kernel
          cp $GITHUB_WORKSPACE/kernel_patches/odin_b11_full.patch /tmp/odin.patch
          set +e
          git apply -p1 --reject --whitespace=nowarn /tmp/odin.patch > /tmp/patch.log 2>&1
          echo "git apply exit=$?"
          set -e
          echo "== 失败项 =="
          grep -E 'error:|rejected' /tmp/patch.log | head -30 || true
          echo "== .rej 文件 =="
          find . -name '*.rej' | head -20
          echo "== 新驱动 =="
          ls drivers/kernelsu | head -25
          echo "== 版本号 =="
          grep -rn "KSU_VERSION" drivers/kernelsu/Makefile | head -3
          echo "== 是否含 susfs 扩展 =="
          ls drivers/kernelsu/extension 2>/dev/null | head

      - name: 6. 修 5.4 兼容（pgtable / vm_fault const）
        run: |
          cd $GITHUB_WORKSPACE/kernel
          find drivers/kernelsu -name '*.c' -o -name '*.h' | xargs grep -ln 'linux/pgtable.h' 2>/dev/null | while read f; do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|' "$f"; echo "pgtable fixed: $f"
          done
          python3 -c "p='include/linux/mm.h'; s=open(p).read(); i=s.index('struct vm_fault {'); j=s.index(chr(10)+'};', i); blk=s[i:j]; s2=s[:i]+(blk.replace(chr(9)+'const struct {', chr(9)+'struct {', 1) if (chr(9)+'const struct {') in blk else blk)+s[j:]; open(p,'w').write(s2); print('vm_fault fixed' if s2!=s else 'no const found')"

      - name: 7. 用作者配置当基底
        run: |
          cd $GITHUB_WORKSPACE/kernel
          ls -l config_prev_backup.config
          mkdir -p out
          cp config_prev_backup.config out/.config
          printf '%s\n' 'CONFIG_KSU=y' 'CONFIG_KSU_FEATURE_ADBROOT=y' '# CONFIG_KSU_DEBUG is not set' '# CONFIG_KPM is not set' >> out/.config
          export PATH=$HOME/clang/bin:$PATH
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig > cfg.log 2>&1 || { tail -40 cfg.log; exit 1; }
          grep -E "KSU|SUSFS|KPM|KALLSYMS_ALL|LOCALVERSION" out/.config | head -20

      - name: 8. 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$HOME/clang/bin:$PATH
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image 2>&1 | tee build.log | grep -E "error|Error|Image" | tail -80 || true
          ls -lh out/arch/arm64/boot/Image*

      - name: 9. 收集产物
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p dist
          cp -v kernel/out/arch/arm64/boot/Image* dist/ 2>/dev/null || true
          cp -v kernel/out/.config dist/config.txt 2>/dev/null || true
          cp -v kernel/cfg.log dist/ 2>/dev/null || true
          cp -v kernel/build.log dist/ 2>/dev/null || true
          cp -v /tmp/patch.log dist/ 2>/dev/null || true
          ls -lh dist

      - name: 10. 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-kernel-out
          path: dist/
          retention-days: 7
