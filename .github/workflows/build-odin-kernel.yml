name: build-odin-kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'kernel source repo'
        required: false
        default: 'https://github.com/MrNya907/xiaomi_kernel_odin.git'
      kernel_ref:
        description: 'kernel branch/tag'
        required: false
        default: 'master'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 1. 释放磁盘空间
        run: |
          echo "== 清理前 =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo "== 清理后 =="; df -h /

      - name: 2. 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 zip lz4 zstd git curl rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: 3. 下载 AOSP clang r383902b1
        run: |
          cd $HOME
          curl -sSL -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"
          ls -lh clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          ./clang/bin/clang --version | head -2

      - name: 4. 拉取内核源码
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b "${{ github.event.inputs.kernel_ref }}" \
            "${{ github.event.inputs.kernel_repo }}" kernel
          cd kernel && git log -1 --oneline
          ls -l arch/arm64/configs/odin_defconfig

      - name: 5. 集成 KernelSU-Next (legacy)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "== 注入结果 =="
          ls -d KernelSU* 2>/dev/null || true
          git status --short | head -20
          echo "== KSU Kconfig 符号 =="
          grep -rn "config KSU" KernelSU-Next/kernel/Kconfig 2>/dev/null | head -20 || true

      - name: 6. 尝试 susfs k5.4 补丁 (失败自动回滚)
        id: susfs
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b k5.4 https://github.com/dev-sm8350/susfs4ksu.git susfs
          cd kernel
          P=$GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch
          if patch -p1 --forward --dry-run < $P > /tmp/susfs_dry.log 2>&1; then
            patch -p1 --forward < $P
            echo "SUSFS=1" >> $GITHUB_ENV
            echo "susfs 补丁全部命中"
          else
            echo "== dry-run 未通过，回滚 =="
            head -40 /tmp/susfs_dry.log
            git checkout -- . && git clean -fd
            echo "SUSFS=0" >> $GITHUB_ENV
            echo "SUSFS 这一轮跳过，只出 KernelSU-Next 版"
          fi

      - name: 7. 写入 defconfig 开关
        run: |
          cd $GITHUB_WORKSPACE/kernel
          cat >> arch/arm64/configs/odin_defconfig <<'EOF'

          # ---- KernelSU Next ----
          CONFIG_KSU=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_MODULES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          if [ "$SUSFS" = "1" ]; then
            cat >> arch/arm64/configs/odin_defconfig <<'EOF'
          # ---- susfs ----
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          EOF
          fi
          echo "SUSFS 状态: $SUSFS"

      - name: 8. 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) O=out ARCH=arm64 odin_defconfig > cfg.log 2>&1 || { tail -40 cfg.log; exit 1; }
          echo "== config 里的 KSU =="
          grep -E "CONFIG_KSU|CONFIG_KPROBES=|CONFIG_KALLSYMS_ALL" out/.config | head -20
          echo "== 警告/未知符号 =="
          grep -iE "unknown|ignoring" cfg.log | head -10 || true
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 2>&1 | tee build.log | tail -60
          echo "== 产物 =="
          ls -lh out/arch/arm64/boot/ 2>/dev/null || true

      - name: 9. 收集产物
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p dist
          cp -v kernel/out/arch/arm64/boot/Image* dist/ 2>/dev/null || true
          cp -v kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb dist/ 2>/dev/null || true
          find kernel/out -name '*.ko' -exec cp -v {} dist/ \; 2>/dev/null || true
          cp -v kernel/out/.config dist/config.txt 2>/dev/null || true
          cp -v kernel/build.log dist/ 2>/dev/null || true
          cp -v kernel/cfg.log dist/ 2>/dev/null || true
          ls -lh dist

      - name: 10. 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-kernel-out
          path: dist/
          retention-days: 7
