name: build-odin-kernel

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 0. 检出本仓库（取移植补丁）
        uses: actions/checkout@v4

      - name: 1. 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 2. 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 zip lz4 zstd git curl rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: 3. 下载 AOSP clang r383902b1
        run: |
          cd $HOME
          curl -sSL -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          ./clang/bin/clang --version | head -2

      - name: 4. 拉取内核（liqidecg odin 5.4.281 + susfs v2.1.0）
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b main https://github.com/liqidecg/xiaomi_kernel_odin.git kernel
          cd kernel
          git log -1 --oneline
          grep -n 'SUSFS_VERSION' include/linux/susfs.h

      - name: 5. 从作者补丁还原 5.4 已验证驱动
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b master https://github.com/MrNya907/xiaomi_kernel_odin.git legacy
          cd legacy
          set +e
          git apply -p1 --reject --whitespace=nowarn $GITHUB_WORKSPACE/kernel_patches/odin_b11_full.patch > /tmp/patch.log 2>&1
          echo "apply exit=$?"
          set -e
          grep -E 'error:|rejected' /tmp/patch.log | head -10 || true
          ls drivers/kernelsu | head -20
          ls drivers/kernelsu/susfs 2>/dev/null | head
          cd $GITHUB_WORKSPACE
          rm -rf kernel/drivers/kernelsu
          mkdir -p kernel/drivers/kernelsu
          rsync -a legacy/drivers/kernelsu/ kernel/drivers/kernelsu/
          echo "== 驱动已放入 =="
          ls kernel/drivers/kernelsu | head -25

      - name: 6. 兼容处理（坏头文件 / pgtable / susfs 新版接口桩）
        run: |
          cd $GITHUB_WORKSPACE/kernel
          for f in $(find techpack -name '*.h' -size -300c); do
            c=$(cat "$f" 2>/dev/null | tr -d '\r\n')
            case "$c" in
              *'/'*.h) t="$(dirname "$f")/$c"
                if [ -f "$t" ]; then cp -f "$t" "$f"; echo "fixed $f"; fi ;;
            esac
          done
          for f in $(grep -rln 'linux/pgtable.h' drivers/kernelsu 2>/dev/null); do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|' "$f"
            echo "pgtable fixed: $f"
          done
          grep -rln 'linux/pgtable.h' drivers/kernelsu || echo "pgtable 无残留"
          printf '%s\n' \
            '' \
            '/* compat: susfs v2.1 缺的新接口 */' \
            '#ifndef CMD_SUSFS_SET_PRIORITY_UID_FILTER' \
            '#define CMD_SUSFS_SET_PRIORITY_UID_FILTER 0x60030' \
            '#endif' \
            'void susfs_set_priority_uid_filter(void __user **user_info);' \
            'void susfs_parse_priority_app_strings(void);' \
            'void susfs_set_current_proc_no_su(void);' \
            'void susfs_set_current_proc_umounted_for_zygote_next(void);' >> include/linux/susfs.h
          printf '%s\n' \
            '' \
            '/* compat: susfs v2.1 缺的新接口桩实现 */' \
            'void susfs_set_priority_uid_filter(void __user **user_info) { (void)user_info; }' \
            'void susfs_parse_priority_app_strings(void) { }' \
            'void susfs_set_current_proc_no_su(void) { }' \
            'void susfs_set_current_proc_umounted_for_zygote_next(void) { }' >> fs/susfs.c
          sed -i 's|fake_state|selinux_state|g' security/selinux/selinuxfs.c security/selinux/hooks.c
          grep -rn 'fake_state' security/selinux | head -3 || echo 'fake_state 已清除'
          printf '%s\n' \
            'int susfs_add_sus_type(const char *secctx, u32 type_value) { (void)secctx; (void)type_value; return 0; }' \
            'int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u16 type, u32 orig_avd_allowed)' \
            '{ (void)s_type; (void)t_type; (void)type; (void)orig_avd_allowed; return 0; }' >> fs/susfs.c
          printf '%s\n' \
            'int susfs_add_sus_type(const char *secctx, u32 type_value);' \
            'int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u16 type, u32 orig_avd_allowed);' >> include/linux/susfs.h
          printf '%s\n' \
            '#include <linux/module.h>' \
            '#include <linux/net.h>' \
            '#include <linux/types.h>' \
            'struct sock *rekernel_netlink;' \
            'int rekernel_netlink_unit;' > drivers/kernelsu/rekernel_stub.c
          if ! grep -q rekernel_stub drivers/kernelsu/Makefile; then
            printf '%s\n' 'obj-$(CONFIG_KSU) += rekernel_stub.o' >> drivers/kernelsu/Makefile
          fi
          echo "stubs done"
          printf '%s\n' \
            '#ifndef __KSU_COMPAT54_H' \
            '#define __KSU_COMPAT54_H' \
            '#include <linux/version.h>' \
            '#include <linux/uaccess.h>' \
            '#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)' \
            'static inline long ksu54_strncpy_from_user_nofault(char *dst, const void __user *src, long n)' \
            '{ return probe_user_read(dst, src, n); }' \
            'static inline long ksu54_copy_from_user_nofault(void *dst, const void __user *src, size_t n)' \
            '{ return probe_user_read(dst, src, n); }' \
            'static inline long ksu54_copy_to_user_nofault(void __user *dst, const void *src, size_t n)' \
            '{ return probe_kernel_write((void *)dst, src, n); }' \
            '#define strncpy_from_user_nofault ksu54_strncpy_from_user_nofault' \
            '#define copy_from_user_nofault ksu54_copy_from_user_nofault' \
            '#define copy_to_user_nofault ksu54_copy_to_user_nofault' \
            '#endif' \
            '#endif' > drivers/kernelsu/ku_compat54.h
          for kf in drivers/kernelsu/Kbuild drivers/kernelsu/Makefile; do
            if [ -f "$kf" ] && ! grep -q ku_compat54.h "$kf"; then
              printf '%s\n' 'ccflags-y += -include $(srctree)/drivers/kernelsu/ku_compat54.h' >> "$kf"
              echo "compat include -> $kf"
            fi
          done
          tail -5 include/linux/susfs.h
          tail -4 fs/susfs.c

      - name: 7. 配置（odin_defconfig + KSU/susfs 开关）
        run: |
          cd $GITHUB_WORKSPACE/kernel
          mkdir -p out
          cp arch/arm64/configs/odin_defconfig out/.config
          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_FEATURE_ADBROOT=y' \
            '# CONFIG_KSU_DEBUG is not set' \
            'CONFIG_KPM=y' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_MAP=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
            'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' \
            'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' \
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \
            '# CONFIG_KSU_SUSFS_SUS_SU is not set' \
            '# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set' \
            '# CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT is not set' \
            '# CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT is not set' \
            '# CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT is not set' >> out/.config
          export PATH=$HOME/clang/bin:$PATH
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig > cfg.log 2>&1 || { tail -40 cfg.log; exit 1; }
          grep -E "CONFIG_KSU|CONFIG_SUSFS|CONFIG_KPM|CONFIG_KALLSYMS_ALL|LOCALVERSION=" out/.config | head -25

      - name: 8. 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$HOME/clang/bin:$PATH
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image 2>&1 | tee build.log | grep -E "error|Image is ready|Kernel:" | tail -60 || true
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || echo "无 Image"

      - name: 9. 收集产物
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p dist
          cp -v kernel/out/arch/arm64/boot/Image* dist/ 2>/dev/null || true
          cp -v kernel/out/.config dist/config.txt 2>/dev/null || true
          cp -v kernel/cfg.log dist/ 2>/dev/null || true
          cp -v kernel/build.log dist/ 2>/dev/null || true
          cp -v /tmp/patch.log dist/ 2>/dev/null || true
          ls -lh dist

      - name: 10. 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-kernel-out
          path: dist/
          retention-days: 7
