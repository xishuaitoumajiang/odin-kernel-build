name: build-odin-kernel

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 1. 释放磁盘空间
        run: |
          echo "== 清理前 =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo "== 清理后 =="; df -h /

      - name: 2. 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 zip lz4 zstd git curl rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: 3. 下载 AOSP clang r383902b1
        run: |
          cd $HOME
          curl -sSL -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"
          ls -lh clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          ./clang/bin/clang --version | head -2

      - name: 4. 拉取内核源码并移除树内旧版 kernelsu
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b master https://github.com/MrNya907/xiaomi_kernel_odin.git kernel
          cd kernel && git log -1 --oneline
          rm -rf drivers/kernelsu
          echo "== 删除后剩余引用 =="
          grep -n kernelsu drivers/Makefile drivers/Kconfig || true
          echo "== 树内 susfs =="
          ls -l fs/susfs.c fs/sus_su.c include/linux/susfs.h 2>/dev/null || echo 无
          grep -n susfs fs/Makefile || true

      - name: 5. 换成 SukiSU-Ultra 4.x 驱动源码
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git sukisu
          cd sukisu && git log -1 --oneline
          mkdir -p $GITHUB_WORKSPACE/kernel/drivers/kernelsu
          cp -rL sukisu/kernel/. $GITHUB_WORKSPACE/kernel/drivers/kernelsu/
          cd $GITHUB_WORKSPACE/kernel
          ls drivers/kernelsu | head -20
          echo "== uapi 头 =="
          ls drivers/kernelsu/include/uapi 2>/dev/null | head -10 || echo "uapi 缺失"
          echo "== 版本号 =="
          grep -rn "KSU_VERSION" drivers/kernelsu/Makefile | head -5
          echo "== 是否自带 susfs 扩展 =="
          ls drivers/kernelsu/extension 2>/dev/null | head -10

      - name: 5b. 修 patch_memory.c 的 __p4d_to_phys（5.4 无此函数）
        run: |
          cd $GITHUB_WORKSPACE/kernel
          for f in drivers/kernelsu/hook/arm64/patch_memory.c drivers/kernelsu/hook/patch_memory.c; do
            if [ -f "$f" ]; then
              python3 -c "import sys; p=sys.argv[1]; s=open(p).read(); s=s.replace('#if defined(p4d_leaf)', '#if defined(p4d_leaf) && defined(__p4d_to_phys)').replace('#if defined(pud_leaf)', '#if defined(pud_leaf) && defined(__pud_to_phys)').replace('#if defined(pmd_leaf)', '#if defined(pmd_leaf) && defined(__pmd_to_phys)'); open(p,'w').write(s)" "$f"
              echo "已处理 $f"
              grep -n 'defined(p4d_leaf)' "$f" || true
            fi
          done

      - name: 6. 修 struct vm_fault 的 const 匿名结构
        run: |
          cd $GITHUB_WORKSPACE/kernel
          python3 -c "p='include/linux/mm.h'; s=open(p).read(); i=s.index('struct vm_fault {'); j=s.index(chr(10)+'};', i); blk=s[i:j]; s2=s[:i]+blk.replace(chr(9)+'const struct {', chr(9)+'struct {', 1)+s[j:] if (chr(9)+'const struct {') in blk else s; open(p,'w').write(s2); print('vm_fault const removed' if s2!=s else 'no const found')"

      - name: 7. 写入 defconfig（SukiSU，先不开 susfs）
        run: |
          cd $GITHUB_WORKSPACE/kernel
          printf '%s\n' '' '# ---- SukiSU-Ultra ----' 'CONFIG_KSU=y' 'CONFIG_KSU_MANUAL_SU=y' '# CONFIG_KPM is not set' '# CONFIG_KSU_DEBUG is not set' 'CONFIG_KPROBES=y' 'CONFIG_KRETPROBES=y' 'CONFIG_KALLSYMS=y' 'CONFIG_KALLSYMS_ALL=y' 'CONFIG_MODULES=y' 'CONFIG_OVERLAY_FS=y' 'CONFIG_TMPFS_XATTR=y' 'CONFIG_TMPFS_POSIX_ACL=y' 'CONFIG_EXT4_FS=y' >> arch/arm64/configs/odin_defconfig
          tail -22 arch/arm64/configs/odin_defconfig

      - name: 8. 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$HOME/clang/bin:$PATH
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- odin_defconfig > cfg.log 2>&1 || { tail -60 cfg.log; exit 1; }
          echo "== config 关键项 =="
          grep -E "KSU|KPROBES=|KALLSYMS_ALL|EXT4_FS=" out/.config | head -30
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image 2>&1 | tee build.log | grep -E "error|Error|Image|warning: unused" | tail -60 || true
          ls -lh out/arch/arm64/boot/Image*

      - name: 9. 收集产物
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p dist
          cp -v kernel/out/arch/arm64/boot/Image* dist/ 2>/dev/null || true
          cp -v kernel/out/.config dist/config.txt 2>/dev/null || true
          cp -v kernel/cfg.log dist/ 2>/dev/null || true
          ls -lh dist

      - name: 10. 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-kernel-out
          path: dist/
          retention-days: 7
