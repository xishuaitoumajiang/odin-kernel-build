name: build-odin-kernel

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 0. 检出本仓库
        uses: actions/checkout@v4

      - name: 1. 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 2. 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 zip lz4 zstd git curl rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: 3. 下载 AOSP clang r383902b1
        run: |
          cd $HOME
          curl -sSL -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          ./clang/bin/clang --version | head -2

      - name: 4. 拉取内核源码（自带 susfs v2.1.0 的 odin 5.4.281）
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b main https://github.com/liqidecg/xiaomi_kernel_odin.git kernel
          cd kernel
          git log -1 --oneline
          head -4 Makefile
          grep -n 'SUSFS_VERSION' include/linux/susfs.h
          grep -nE 'kernelsu|KSU' drivers/Makefile drivers/Kconfig
          ls drivers/kernelsu 2>/dev/null || echo "驱动目录不存在（预期）"

      - name: 5. 放入 SukiSU 4.x 驱动并补 susfs Kconfig
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git sukisu
          rm -rf kernel/drivers/kernelsu
          mkdir -p kernel/drivers/kernelsu
          cp -aL sukisu/kernel/. kernel/drivers/kernelsu/
          ls kernel/drivers/kernelsu | head -20
          head -20 kernel/drivers/kernelsu/Kconfig
          printf '%s\n' '' 'menu "KernelSU - SUSFS"' \
            'config KSU_SUSFS' '	bool "Enable susfs"' '	default n' \
            'config KSU_SUSFS_SUS_PATH' '	bool "sus_path"' '	depends on KSU_SUSFS' '	default y' \
            'config KSU_SUSFS_SUS_MOUNT' '	bool "sus_mount"' '	depends on KSU_SUSFS' '	default y' \
            'config KSU_SUSFS_SUS_KSTAT' '	bool "sus_kstat"' '	depends on KSU_SUSFS' '	default y' \
            'config KSU_SUSFS_SPOOF_UNAME' '	bool "spoof uname"' '	depends on KSU_SUSFS' '	default y' \
            'config KSU_SUSFS_ENABLE_LOG' '	bool "susfs log"' '	depends on KSU_SUSFS' '	default y' \
            'config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS' '	bool "hide ksu/susfs symbols"' '	depends on KSU_SUSFS' '	default y' \
            'config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG' '	bool "spoof cmdline/bootconfig"' '	depends on KSU_SUSFS' '	default y' \
            'config KSU_SUSFS_OPEN_REDIRECT' '	bool "open redirect"' '	depends on KSU_SUSFS' '	default y' \
            'config KSU_SUSFS_SUS_MAP' '	bool "sus_map"' '	depends on KSU_SUSFS' '	default y' \
            'endmenu' >> kernel/drivers/kernelsu/Kconfig
          tail -5 kernel/drivers/kernelsu/Kconfig

      - name: 6. 修损坏头文件与 5.4 兼容
        run: |
          cd $GITHUB_WORKSPACE/kernel
          echo "== 修复 techpack 里存成路径文本的坏头文件 =="
          for f in $(find techpack -name '*.h' -size -300c); do
            c=$(cat "$f" 2>/dev/null | tr -d '\r\n')
            case "$c" in
              *'/'*.h) t="$(dirname "$f")/$c"
                if [ -f "$t" ]; then cp -f "$t" "$f"; echo "fixed $f"; fi ;;
            esac
          done
          for f in $(grep -rln 'linux/pgtable.h' drivers/kernelsu 2>/dev/null); do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|' "$f"
            echo "pgtable fixed: $f"
          done
          sed -i 's|copy_from_user_nofault(to, from, count)|probe_user_read(to, from, count)|' drivers/kernelsu/kernel_compat.h
          grep -n 'probe_user_read' drivers/kernelsu/kernel_compat.h
          sed -i 's|strncpy_from_user_nofault(path, \*filename_user, sizeof(path));|ksu_copy_from_user_retry(path, *filename_user, sizeof(path));|g' drivers/kernelsu/feature/sucompat.c
          sed -i '1i #include "kernel_compat.h"' drivers/kernelsu/feature/sucompat.c
          sed -i 's|#if defined(p4d_leaf)|#if defined(p4d_leaf) \&\& defined(__p4d_to_phys)|' drivers/kernelsu/hook/arm64/patch_memory.c
          sed -i 's|copy_to_kernel_nofault(map, src, len)|probe_kernel_write(map, src, len)|' drivers/kernelsu/hook/arm64/patch_memory.c
          grep -n 'p4d_leaf\|probe_kernel_write' drivers/kernelsu/hook/arm64/patch_memory.c
          printf '%s\n' \
            '#include <linux/version.h>' \
            'struct seccomp_filter;' \
            'void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr) { (void)filter; (void)nr; }' \
            'void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr) { (void)filter; (void)nr; }' \
            > drivers/kernelsu/infra/seccomp_cache.c
          cat drivers/kernelsu/infra/seccomp_cache.c
          python3 $GITHUB_WORKSPACE/scripts/fix_54.py $GITHUB_WORKSPACE/kernel
          grep -n 'handle_event' drivers/kernelsu/manager/pkg_observer.c
          head -6 drivers/kernelsu/feature/sucompat.c
          grep -c 'ksu_copy_from_user_retry' drivers/kernelsu/feature/sucompat.c

      - name: 7. 用 odin_defconfig 配置
        run: |
          cd $GITHUB_WORKSPACE/kernel
          mkdir -p out
          cp arch/arm64/configs/odin_defconfig out/.config
          export PATH=$HOME/clang/bin:$PATH
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig > cfg.log 2>&1 || { tail -40 cfg.log; exit 1; }
          grep -E "CONFIG_KSU|CONFIG_KPM|CONFIG_KPROBES=|CONFIG_KALLSYMS_ALL|LOCALVERSION=" out/.config | head -20

      - name: 8. 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$HOME/clang/bin:$PATH
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image 2>&1 | tee build.log | grep -E "error|Error|Image" | tail -80 || true
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || echo "无 Image"

      - name: 9. 收集产物
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p dist
          cp -v kernel/out/arch/arm64/boot/Image* dist/ 2>/dev/null || true
          cp -v kernel/out/.config dist/config.txt 2>/dev/null || true
          cp -v kernel/cfg.log dist/ 2>/dev/null || true
          cp -v kernel/build.log dist/ 2>/dev/null || true
          ls -lh dist

      - name: 10. 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-kernel-out
          path: dist/
          retention-days: 7
