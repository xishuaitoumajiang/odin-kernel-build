name: build-odin-kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'kernel source repo'
        required: false
        default: 'https://github.com/MrNya907/xiaomi_kernel_odin.git'
      kernel_ref:
        description: 'kernel branch/tag'
        required: false
        default: 'master'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 1. 释放磁盘空间
        run: |
          echo "== 清理前 =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo "== 清理后 =="; df -h /

      - name: 2. 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 zip lz4 zstd git curl rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: 3. 下载 AOSP clang r383902b1
        run: |
          cd $HOME
          curl -sSL -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"
          ls -lh clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          ./clang/bin/clang --version | head -2
          ls clang/bin | head

      - name: 4. 拉取内核源码
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b "${{ github.event.inputs.kernel_ref }}" \
            "${{ github.event.inputs.kernel_repo }}" kernel
          cd kernel && git log -1 --oneline
          ls -l arch/arm64/configs/odin_defconfig
          echo "== 内核自带 susfs 源码 =="
          ls -l fs/susfs.c fs/sus_su.c 2>/dev/null || echo "无 in-tree susfs"
          grep -n susfs fs/Makefile || true

      - name: 5. 集成 KernelSU-Next (legacy)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          ls -d KernelSU* 2>/dev/null || true
          git status --short | head -20

      - name: 6. 修 struct vm_fault 的 const 匿名结构（clang 不接受）
        run: |
          cd $GITHUB_WORKSPACE/kernel
          python3 - <<'EOF'
          p = 'include/linux/mm.h'
          s = open(p).read()
          i = s.index('struct vm_fault {')
          j = s.index('\n};', i)
          blk = s[i:j]
          if '\tconst struct {' in blk:
              blk = blk.replace('\tconst struct {', '\tstruct {', 1)
              s = s[:i] + blk + s[j:]
              open(p, 'w').write(s)
              print('已去掉 vm_fault 匿名结构的 const')
          else:
              print('未找到 const 匿名结构，跳过')
          EOF
          sed -n '/struct vm_fault {/,/^};/p' include/linux/mm.h | head -12

      - name: 7. 写入 defconfig 开关
        run: |
          cd $GITHUB_WORKSPACE/kernel
          cat >> arch/arm64/configs/odin_defconfig <<'EOF'

          # ---- KernelSU Next (legacy, susfs 走内核自带实现) ----
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_MODULES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          tail -12 arch/arm64/configs/odin_defconfig

      - name: 8. 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$HOME/clang/bin:$PATH
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            odin_defconfig > cfg.log 2>&1 || { tail -40 cfg.log; exit 1; }
          echo "== config 关键项 =="
          grep -E "CONFIG_KSU$|CONFIG_KSU_|CONFIG_KPROBES=|CONFIG_SPECULATIVE_PAGE_FAULT" out/.config | head -25
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image 2>&1 | tee build.log | tail -60
          echo "== 产物 =="
          ls -lh out/arch/arm64/boot/Image*

      - name: 9. 收集产物
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p dist
          cp -v kernel/out/arch/arm64/boot/Image* dist/ 2>/dev/null || true
          find kernel/out -name '*.ko' -exec cp -v {} dist/ \; 2>/dev/null || true
          cp -v kernel/out/.config dist/config.txt 2>/dev/null || true
          cp -v kernel/build.log dist/ 2>/dev/null || true
          cp -v kernel/cfg.log dist/ 2>/dev/null || true
          ls -lh dist

      - name: 10. 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-kernel-out
          path: dist/
          retention-days: 7
